<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ovyra</title>
<style>
  :root {
    --accent:#ED4872; --cool:#7aa6ff; --deep:#12265B;
    --ink:#F3F8FC; --steel:#353E5B; --abyss:#10182B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html, body {
    height:100%; font-family:'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink); overflow: hidden;
    background:
      radial-gradient(800px 600px at 80% 90%, rgba(18,38,91,.55), transparent 60%),
      radial-gradient(700px 600px at 10% 10%, rgba(53,62,91,.35), transparent 60%),
      linear-gradient(160deg, #0a1126, var(--abyss) 60%, #0a1226);
  }
  .wrap {
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 28px; padding: 40px;
  }

  .time {
    font-size: 84px; font-weight: 300; letter-spacing: -.04em;
    color: rgba(243,248,252,.95); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .time .colon { opacity: .35; margin: 0 2px; animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .9 } }

  .greet {
    font-size: 18px; color: rgba(243,248,252,.55);
    font-weight: 400; letter-spacing: .01em;
  }

  .search {
    margin-top: 8px; display:flex; align-items:center;
    width: min(640px, 90vw);
    background: rgba(16,24,43,.55);
    border: 1px solid rgba(243,248,252,.1);
    border-radius: 14px; padding: 12px 16px;
    backdrop-filter: blur(14px);
    transition: border-color .15s, transform .15s;
  }
  .search:focus-within {
    border-color: var(--cool);
    transform: translateY(-1px);
  }
  .search input {
    flex:1; background:transparent; border:0; outline:0;
    color:#fff; font-size: 15px; font-family: inherit;
  }
  .search input::placeholder { color: rgba(243,248,252,.4); }
  .search button {
    background: rgba(122,166,255,.15); color: #fff; border: 0;
    padding: 8px 16px; border-radius: 9px; font-weight: 500;
    cursor: pointer; font-family: inherit; font-size: 13px;
    transition: background .15s;
  }
  .search button:hover { background: rgba(122,166,255,.25); }

  /* Tile grid */
  .grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 10px; width: min(720px, 92vw);
    margin-top: 4px;
  }
  .tile {
    position: relative;
    aspect-ratio: 1;
    border: 1px solid rgba(243,248,252,.07);
    border-radius: 12px;
    background: rgba(16,24,43,.4);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 6px; cursor: pointer;
    text-decoration: none; color: inherit;
    transition: all .15s;
    font-family: inherit;
  }
  .tile:hover {
    transform: translateY(-2px);
    border-color: rgba(122,166,255,.4);
    background: rgba(16,24,43,.6);
  }
  .tile-icon {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 600;
    color: rgba(243,248,252,.85);
  }
  .tile-icon img {
    width: 24px; height: 24px; object-fit: contain;
    border-radius: 5px;
  }
  .tile-name {
    font-size: 10.5px; color: rgba(243,248,252,.55);
    max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* × remove button — only visible on tile hover */
  .tile-x {
    position: absolute; top: 4px; right: 4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(232, 17, 35, .85); color: #fff;
    border: 0; font-size: 12px; line-height: 1;
    display: grid; place-items: center;
    opacity: 0; cursor: pointer;
    transition: opacity .15s, transform .15s;
  }
  .tile:hover .tile-x { opacity: 1; }
  .tile-x:hover { transform: scale(1.12); }

  /* Add-tile button */
  .tile-add {
    border-style: dashed;
    color: rgba(243,248,252,.4);
    font-size: 22px; font-weight: 300;
  }
  .tile-add:hover { color: var(--cool); border-color: var(--cool); }

  /* Inline add form */
  .add-form {
    width: min(640px, 90vw);
    background: rgba(16,24,43,.55);
    border: 1px solid rgba(122,166,255,.4);
    border-radius: 12px; padding: 10px;
    display: flex; gap: 8px; align-items: center;
    backdrop-filter: blur(14px);
    animation: slideIn .15s ease-out;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } }
  .add-form[hidden] { display: none; }
  .add-form input {
    background: transparent; border: 0; outline: 0;
    color: #fff; font-size: 13px; font-family: inherit;
    padding: 6px 10px;
    border: 1px solid rgba(243,248,252,.1); border-radius: 8px;
  }
  .add-form input:focus { border-color: var(--cool); }
  .add-form input[name="name"] { width: 130px; }
  .add-form input[name="url"]  { flex: 1; min-width: 0; }
  .add-form input::placeholder { color: rgba(243,248,252,.35); }
  .add-form .btn {
    border: 0; padding: 7px 14px; border-radius: 8px;
    background: var(--cool); color: #fff; font-weight: 500;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .add-form .btn-cancel {
    background: transparent; color: rgba(243,248,252,.55);
    padding: 7px 10px;
  }
  .add-form .btn-cancel:hover { color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="time" id="time"></div>
  <div class="greet" id="greet"></div>

  <form class="search" onsubmit="go(this.q.value); return false;">
    <input name="q" autocomplete="off" placeholder="Search or enter address" autofocus />
    <button type="submit">Go</button>
  </form>

  <div class="grid" id="grid"></div>

  <form class="add-form" id="addForm" hidden onsubmit="addSite(event)">
    <input name="name" placeholder="Name" required maxlength="20" autocomplete="off" />
    <input name="url" placeholder="https://example.com" required autocomplete="off" />
    <button type="submit" class="btn">Add</button>
    <button type="button" class="btn btn-cancel" onclick="closeAddForm()">Cancel</button>
  </form>
</div>

<script>
  // ---------- Time + greeting ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    const d = new Date();
    const h = d.getHours();
    document.getElementById('time').innerHTML =
      pad(h) + '<span class="colon">:</span>' + pad(d.getMinutes());
    let g;
    if (h < 5)       g = 'Still up?';
    else if (h < 12) g = 'Good morning.';
    else if (h < 17) g = 'Good afternoon.';
    else if (h < 21) g = 'Good evening.';
    else             g = 'Good night.';
    document.getElementById('greet').textContent = g;
  }
  tick(); setInterval(tick, 30000);

  // ---------- Search ----------
  // The start page is a separate Chromium view (file:// origin), so it can't
  // read the renderer's localStorage. The chosen search engine is passed in
  // via the URL query string instead.
  const ENGINES = {
    ddg:       'https://duckduckgo.com/?q=%s',
    google:    'https://www.google.com/search?q=%s',
    brave:     'https://search.brave.com/search?q=%s',
    bing:      'https://www.bing.com/search?q=%s',
    kagi:      'https://kagi.com/search?q=%s',
    startpage: 'https://www.startpage.com/do/search?q=%s'
  };
  const ENGINE_ID  = new URLSearchParams(location.search).get('engine') || 'ddg';
  const ENGINE_URL = ENGINES[ENGINE_ID] || ENGINES.ddg;

  function go(q) {
    if (!q) return;
    let url = q.trim();
    if (!/^[a-z]+:\/\//i.test(url)) {
      if (/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(url)) url = 'https://' + url;
      else url = ENGINE_URL.replace('%s', encodeURIComponent(url));
    }
    location.href = url;
  }

  // ---------- Customizable tiles (persisted in localStorage) ----------
  const DEFAULTS = [
    { name: 'Google',     icon: 'G',  url: 'https://www.google.com' },
    { name: 'YouTube',    icon: '▶',  url: 'https://www.youtube.com' },
    { name: 'GitHub',     icon: '◐',  url: 'https://github.com' },
    { name: 'Wikipedia',  icon: 'W',  url: 'https://en.wikipedia.org' },
    { name: 'FiveNova',   icon: 'FN', url: 'https://fivenova.org' },
    { name: 'DuckDuckGo', icon: 'D',  url: 'https://duckduckgo.com' }
  ];

  function getSites() {
    try {
      const raw = localStorage.getItem('ovyra:sites');
      if (raw) return JSON.parse(raw);
    } catch {}
    return DEFAULTS.slice();
  }
  function saveSites(s) {
    try { localStorage.setItem('ovyra:sites', JSON.stringify(s)); } catch {}
  }

  // Use DuckDuckGo's favicon service (privacy-friendly) — falls back to letter
  // glyph if the image fails to load.
  function faviconUrl(url) {
    try { return 'https://icons.duckduckgo.com/ip3/' + new URL(url).hostname + '.ico'; }
    catch { return ''; }
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const sites = getSites();

    sites.forEach((s, i) => {
      const tile = document.createElement('a');
      tile.className = 'tile';
      tile.href = 'javascript:go(' + JSON.stringify(s.url) + ')';
      tile.title = s.url;

      const iconSpan = document.createElement('span');
      iconSpan.className = 'tile-icon';
      const img = new Image();
      img.src = faviconUrl(s.url);
      img.alt = '';
      img.onerror = () => {
        iconSpan.textContent = s.name.charAt(0).toUpperCase();
      };
      iconSpan.appendChild(img);

      const nameSpan = document.createElement('span');
      nameSpan.className = 'tile-name';
      nameSpan.textContent = s.name;

      const x = document.createElement('button');
      x.className = 'tile-x'; x.title = 'Remove'; x.textContent = '×';
      x.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        const next = getSites(); next.splice(i, 1); saveSites(next); render();
      });

      tile.append(iconSpan, nameSpan, x);
      grid.appendChild(tile);
    });

    // Add tile
    const add = document.createElement('button');
    add.className = 'tile tile-add';
    add.title = 'Add a site';
    add.innerHTML = '+';
    add.onclick = openAddForm;
    grid.appendChild(add);
  }

  function escape(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  }

  function openAddForm() {
    const f = document.getElementById('addForm');
    f.hidden = false;
    f.querySelector('input[name=name]').focus();
  }
  function closeAddForm() {
    const f = document.getElementById('addForm');
    f.reset();
    f.hidden = true;
  }
  function addSite(e) {
    e.preventDefault();
    const f = e.target;
    const name = f.name.value.trim();
    let url = f.url.value.trim();
    if (!name || !url) return;
    if (!/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
    const sites = getSites();
    sites.push({ name, url });
    saveSites(sites);
    closeAddForm();
    render();
  }

  render();
</script>
</body>
</html>
