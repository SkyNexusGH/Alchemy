# Pushing a version tag (e.g. `npm run release`, which tags v0.1.1) builds the Windows
# installer and publishes it as a GitHub Release. Installed copies of Alchemy find the new
# release on their own and update in place.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Alchemy Tor: the Tor Expert Bundle, checked against the Tor Project's published sums.
      - run: node scripts/fetch-tor.mjs
      - run: npm run typecheck
      - run: npx electron-vite build

      # Create the release up front: electron-builder uploads files in parallel, and if the
      # release doesn't exist yet each upload creates its own, splitting the files apart.
      - name: Create release
        run: gh release create ${{ github.ref_name }} --title "Alchemy ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and upload to the release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
